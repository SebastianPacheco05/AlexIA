[package]
name = "AlexIA"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Open-source Alexa voice bridge scaffold for Gemini"

[lib]
name = "alexia"

[dependencies]
dotenvy = "0.15.7"
axum = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
rand = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_Security_Authorization"] }
