[package]
name = "AlexIA"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Open-source Alexa voice bridge scaffold for Gemini"

[lib]
name = "alexia"

[dependencies]
dotenvy = "0.15.7"
axum = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "io-util", "sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
