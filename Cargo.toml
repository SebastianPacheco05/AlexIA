[package]
name = "gemilexa"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Open-source Alexa voice bridge scaffold for Gemini"

[dependencies]
axum = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
